# ============================================================
# OCTAVIA STUDIO — MASTER CONFIGURATION
# ============================================================
schema_version: 1

studio:
  name: "Octavia Studio"
  default_campaign: wardrobe
  default_count: 64
  contact_sheet_batch: 8

# ------------------------------------------------------------
# How identity is asserted at generation time.
# ------------------------------------------------------------
identity:
  # descriptive : spell every identity attribute out in the prompt.
  #               The only option when no adapter exists, but text alone
  #               will not hold a face across 64 images.
  # lora_token  : lean on a trained LoRA. The trigger token carries the
  #               identity; the descriptive block is dropped because it
  #               COMPETES with the adapter and pulls the face off-model.
  # hybrid      : trigger token plus a minimal anchor (eyes, freckles,
  #               hair signature). Useful while a LoRA is undertrained.
  mode: descriptive
  trigger_token: "ohwx_octavia"
  class_token: "woman"
  lora:
    enabled: false
    name: ""            # filename as ComfyUI sees it, e.g. octavia_v1.safetensors
    strength_model: 0.85
    strength_clip: 0.85

renderer:
  # active backend: mock | diffusers | comfyui | api
  backend: mock

  # Pure-Python local backend — loads a checkpoint into this process and
  # runs the whole multi-pass chain in-process. No server, no HTTP.
  diffusers:
    model_id: ""              # e.g. stabilityai/stable-diffusion-xl-base-1.0
    model_path: ""            # or an absolute path to a local checkout
    device: auto              # auto | cuda | mps | cpu
    local_files_only: true    # never reach the network at render time
    attention_slicing: true   # lower peak VRAM, slight speed cost
    vae_slicing: true
    cpu_offload: false        # set true on <8 GB VRAM
  comfyui:
    host: "127.0.0.1"
    port: 8188
    timeout_seconds: 600
    workflow_template: "config/workflows/octavia_txt2img.json"
  api:
    # endpoint + key come from .env — never commit secrets
    endpoint_env: "OCTAVIA_API_ENDPOINT"
    api_key_env: "OCTAVIA_API_KEY"
    model: ""
    timeout_seconds: 300

# ------------------------------------------------------------
# Prompt assembly
# ------------------------------------------------------------
prompt:
  # compact  : fits one CLIP chunk (75 tokens). Highest per-token
  #            influence and the strongest identity hold. Drops detail.
  # standard : two chunks. Identity plus full wardrobe, pose and scene.
  # full     : no trimming; accepts chunk-4 dilution.
  tier: standard
  # Emit (phrase:weight) emphasis syntax. Supported by ComfyUI and A1111;
  # leave off for backends that treat parentheses literally.
  weighting: false

# ------------------------------------------------------------
# Hero frame — the single highest-quality render
# ------------------------------------------------------------
hero:
  # How many candidate specs to score before picking one. Costs nothing
  # but CPU: candidates are composed and scored, not rendered.
  candidates: 512
  campaign: editorial
  prompt_tier: standard
  weighting: true

  # Relative importance in the hero objective. Identity legibility leads,
  # because a beautiful frame of someone who is not recognisably Octavia
  # has failed at this system's central job.
  weights:
    identity_legibility: 2.2
    framing: 1.8
    lighting: 1.5
    focal: 1.4
    hand_safety: 1.4
    pose_safety: 1.2
    scene_safety: 1.0
    feet_safety: 0.9
    aperture: 0.7
    contact_safety: 0.7
    wardrobe_simplicity: 0.6

  passes:
    base:
      steps: 40
      cfg_scale: 5.0
      sampler: dpmpp_2m_sde
      scheduler: karras
    hires_fix:
      enabled: true
      scale: 1.5
      # Above ~0.5 the refinement pass resamples the face freely and can
      # walk identity off-model between passes. Keep it low.
      denoise: 0.40
      steps: 20
      upscaler: latent
    face_detail:
      enabled: true
      denoise: 0.30
      steps: 20
      padding: 32
      feather: 8
    upscale:
      enabled: false
      scale: 2.0
      model: 4x-UltraSharp

output:
  width: 896
  height: 1152
  format: png
  save_spec_sidecar: true

# ------------------------------------------------------------
# Anti-collapse sampling
# ------------------------------------------------------------
diversity:
  # How hard to push away from recently-used categories.
  # weight = base * (1 / (1 + count))^pressure
  pressure:
    low: 0.6
    normal: 1.2
    high: 2.2
  # Sliding window of recent accepted frames used for penalties
  history_window: 24
  # No single family may exceed this share of a completed campaign
  max_family_share:
    wardrobe_family: 0.14
    scene_family: 0.12
    pose_family: 0.12
    colour_family: 0.10
    camera_shot: 0.20
    expression: 0.18
    head_position: 0.16
  # Absolute caps, enforced at sample time (not just reported)
  hard_caps:
    head_roll_left: 0.08     # <= 8% of accepted photographs

# ------------------------------------------------------------
# Head-pose balancing (section 12)
# ------------------------------------------------------------
head_pose:
  # roll < -4 degrees is a LEFT tilt (Octavia's left / frame right-lean)
  left_roll_threshold_deg: -4.0
  right_roll_threshold_deg: 4.0
  left_tilt_target_share: 0.08
  # Once the left-tilt budget for the run is spent, probability is
  # multiplied by this before being renormalised.
  exhausted_penalty: 0.02
  # Even before the budget is spent, left tilt is down-weighted.
  base_left_weight: 0.25

# ------------------------------------------------------------
# QC thresholds (section 11)
# ------------------------------------------------------------
qc:
  hard_reject:
    identity_consistency: 85
    physique_consistency: 85
    anatomy: 80
    photorealism: 80
  warn_below:
    face_consistency: 82
    hands: 78
    feet: 75
    pose_naturalness: 75
    clothing_integrity: 78
    scene_quality: 70
    composition: 70
    lighting: 70
    novelty: 60
    head_pose_novelty: 55
  # Defect penalties applied to the relevant score
  defect_penalties:
    extra_fingers: 40
    missing_fingers: 35
    merged_limbs: 45
    warped_feet: 30
    asymmetric_eyes: 30
    false_tattoos: 50
    random_writing: 20
    duplicated_objects: 18
    broken_mirror: 25
    incorrect_reflection: 25
    impossible_furniture_contact: 22
    clothing_melting_into_skin: 35

# ------------------------------------------------------------
# Human review feedback weighting (section 13)
# ------------------------------------------------------------
feedback:
  enabled: true
  store: "data/feedback.json"
  # Multipliers applied to a category's sampling weight after review
  weight_delta:
    KEEP: 1.10
    REJECT: 0.80
    IDENTITY_DRIFT: 0.70
    BODY_DRIFT: 0.70
    POSE_DUPLICATE: 0.45
    WARDROBE_BAD: 0.55
    SCENE_BAD: 0.55
  weight_floor: 0.15
  weight_ceiling: 3.0

logging:
  level: INFO
  file: "runs/{run_id}/studio.log"
