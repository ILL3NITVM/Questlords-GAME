# ============================================================
# OCTAVIA — PHYSIQUE LOCK
# ============================================================
# Body proportions are identity, not styling. This file is read
# by pipeline/prompt.py (to build physique clauses) and by
# qc/rules.py (to score physique_consistency).
#
# KEY PRINCIPLE:
#   Apparent body shape in a photograph is a function of
#   (true proportions) x (focal length) x (camera height) x
#   (posture) x (clothing). Only the FIRST is identity.
#   The QC layer must not punish legitimate perspective effects.
# ============================================================

schema_version: 1
physique_version: "1.0.0"

# ------------------------------------------------------------
# Locked ratios. Expressed as relationships, not measurements,
# so they survive crop, focal length and posture changes.
# ------------------------------------------------------------
ratios:
  shoulder_to_waist: 1.55        # shoulders clearly wider than waist
  hip_to_waist: 1.50             # hourglass, not pear, not straight
  shoulder_to_hip: 1.03          # near-balanced top and bottom
  waist_position: "high, sits well above the navel-to-hip midpoint"
  torso_to_leg: 0.86             # slightly leg-dominant, natural
  tolerance: 0.10                # +/- 10% before QC flags drift

# Self-contained phrases with no internal commas — see the note in
# config/identity.yaml for why that matters.
descriptors:
  frame: "a medium frame with a narrow high waist and softly rounded hips"
  shoulders: "smooth gently sloped shoulders"
  bust: "a full natural bust in proportion to her frame"
  waist: "a defined athletic waist with slight natural softness"
  hips: "rounded hips balanced with the shoulder line"
  thighs: "full soft-athletic thighs"
  arms: "slim arms with natural muscle tone"
  legs: "long legs relative to the torso with natural knee and ankle structure"
  abdomen: "a flat abdomen with soft natural definition"
  posture_default: "relaxed natural carriage"
  # Canon principle: the clothes yield to her, never the reverse.
  garment_fit: "clothing that follows her natural figure without reshaping it"

# Prompt assembly, same tiering rationale as identity.yaml.
prompt:
  critical:
    - descriptors.frame
  important:
    - descriptors.waist
    - descriptors.shoulders
    - descriptors.garment_fit
  detail:
    - descriptors.hips
    - descriptors.arms
    - descriptors.legs
    - descriptors.bust
  compact:
    descriptors.frame: "curvy hourglass figure with a narrow waist"
    descriptors.waist: "defined waist"
    descriptors.shoulders: "softly sloped shoulders"
    descriptors.hips: "rounded hips"
    descriptors.arms: "slim toned arms"
    descriptors.legs: "long legs"
    descriptors.bust: "natural proportionate bust"

  # CANON CONFLICT, resolved in favour of the established project.
  #
  # This studio originally emitted "shoulder-to-waist ratio about 1.55" into
  # every prompt. The established Octavia canon is explicit:
  #
  #     "Preserve the supplied body shape without estimating numerical
  #      measurements or changing anatomy to make clothes fit.
  #      Adapt the clothes to her instead."
  #
  # Asserting a numeric ratio is exactly that estimation. The ratios stay in
  # this file because they are useful to a keypoint-based QC scorer comparing
  # a render against the references — measuring an output is not the same as
  # dictating a measurement to the model. They are no longer put in prompts.
  include_ratios: false

# ------------------------------------------------------------
# Anatomy realism requirements
# ------------------------------------------------------------
anatomy:
  hands: "five fingers per hand, correct length ratios, natural knuckles and nail beds"
  feet: "five toes per foot, correct arch and ankle structure"
  joints: "anatomically correct elbows, knees, wrists, ankles"
  limb_count: "exactly two arms and two legs"
  spine: "natural curvature consistent with the pose"

# ------------------------------------------------------------
# Permitted natural variation — QC must NOT treat these as drift
# ------------------------------------------------------------
permitted_variation:
  - "apparent bust/hip size shift from 24mm vs 105mm focal length"
  - "waist appearing narrower when arms are raised"
  - "torso compression when seated or leaning"
  - "shoulder line changing with rotation"
  - "silhouette changes from structured vs draped clothing"
  - "apparent height change from camera height"
  - "soft tissue redistribution when lying or seated"

# ------------------------------------------------------------
# Forbidden drift — these ARE identity violations
# ------------------------------------------------------------
forbidden_drift:
  - "body mass changing between frames at the same focal length"
  - "waist becoming impossibly narrow"
  - "bust scaling beyond anatomical plausibility"
  - "shoulder width changing independent of rotation"
  - "limb length ratios changing"
  - "apparent age shifting younger or older"
  - "height impression changing at matched camera height"

physique_negatives:
  - "anatomically impossible proportions"
  - "exaggerated hourglass"
  - "wasp waist"
  - "bodybuilder musculature"
  - "emaciated"
  - "distorted torso"
  - "elongated limbs"
  - "shortened limbs"
  - "extra fingers"
  - "missing fingers"
  - "fused fingers"
  - "malformed hands"
  - "malformed feet"
  - "extra limbs"
  - "merged limbs"
  - "broken joints"
  - "warped anatomy"
  # Canon: adapt the clothes to her, not her to the clothes.
  - "body reshaped to fit the clothing"
  - "waist cinched beyond her natural shape"
