# ============================================================
# OCTAVIA — CANONICAL IDENTITY SPECIFICATION
# ============================================================
# This file is the single source of truth for who Octavia is.
# It is deliberately SCOPED to identity only. It must never
# contain clothing, pose, camera, environment, lighting or
# expression terms — those are variable axes owned by the
# wardrobe / pose / scene / camera / lighting engines.
#
# Editing this file changes Octavia. Treat it as versioned.
# ============================================================

schema_version: 1
persona_id: octavia
identity_version: "1.0.0"

provenance:
  origin: "Owner-supplied avatar render, developed into a consistent fictional persona."
  fictional: true
  depicts_real_person: false
  notes: >
    Octavia is a fictional adult persona owned by the operator of this studio.
    She is not a depiction of any identifiable third party. The reference set in
    assets/octavia/ defines her; those files are read-only inputs to the pipeline.

# ------------------------------------------------------------
# Hard invariants — enforced, never sampled, never varied.
# ------------------------------------------------------------
invariants:
  apparent_age_band: "adult, mid-to-late twenties"
  minimum_apparent_age: 25
  sex_presentation: "adult woman"
  tattoos: none
  piercings: "small stud earrings at most"

# ------------------------------------------------------------
# Facial identity anchors
#
# Every value below is a SELF-CONTAINED noun phrase with no internal
# commas. This is deliberate: prompt.py joins fields with ", ", so a value
# containing its own commas fragments into orphaned adjectives ("full",
# "smooth", "feminine") that reach the model with no referent noun.
# ------------------------------------------------------------
face:
  geometry:
    face_shape: "soft oval face with a gently tapered jawline"
    cheekbones: "defined but soft cheekbones with natural mid-face fullness"
    chin: "a rounded slightly narrow chin"
    jaw: "a smooth feminine jawline without heavy angle"
    nose: "a straight narrow nose with a refined rounded tip"
    lips: "full lips with a well-defined cupid's bow in a natural rose tone"
    philtrum: "a short clearly defined philtrum"
    interocular_spacing: "slightly wide-set eyes"
  eyes:
    colour: "green-hazel eyes with an olive-green outer iris and warm amber flecking near the pupil"
    shape: "almond eyes with a slight upward outer tilt"
    lashes: "dark lashes of natural length"
    symmetry: "symmetrical eyes of identical shape and size"
  brows:
    phrase: "full expressive dark brown eyebrows softly arched and groomed but natural"
  skin:
    tone: "warm light-olive skin"
    freckles: "natural freckles scattered across the nose bridge and upper cheeks"
    texture: "real skin texture with visible pores and natural subsurface scattering"
    finish: "never plastic or airbrushed or waxy"

# ------------------------------------------------------------
# Hair identity anchors
# ------------------------------------------------------------
hair:
  phrase: "long thick dark brunette hair past the collarbone in soft natural waves"
  base_colour: "cool espresso base with warmer mid-brown mid-lengths"
  signature_highlight:
    phrase: "muted olive lime-green face-framing highlights on both sides of the part"
    required: true
  # Styling is VARIABLE and lives in the pose layer, not here.
  variable_styling:
    - "worn down"
    - "half-up"
    - "messy updo"
    - "loose bun"
    - "tucked behind one ear"

# ------------------------------------------------------------
# PROMPT ASSEMBLY — which anchors matter most, and by how much.
#
# CLIP encodes 77 tokens per chunk and influence falls off sharply past
# chunk 1, so the identity anchors that define recognisability must be
# guaranteed a place there. `critical` is never dropped; `detail` is the
# first thing sacrificed when the budget is tight.
# ------------------------------------------------------------
prompt:
  critical:
    - face.eyes.colour
    - face.skin.freckles
    - hair.phrase
    - hair.signature_highlight.phrase
  important:
    - face.skin.texture
    - face.geometry.face_shape
    - face.eyes.shape
  detail:
    - face.brows.phrase
    - face.geometry.nose
    - face.geometry.lips
    - face.skin.tone
    - face.geometry.jaw
    - face.eyes.symmetry
    - face.geometry.cheekbones
  # Terse forms used by the `compact` tier, where the whole prompt must
  # fit one 75-token CLIP chunk. Same anchors, fewer tokens — a compact
  # prompt that keeps identity but loses pose and scene is not a
  # photograph specification, so identity has to give ground too.
  compact:
    face.eyes.colour: "green-hazel eyes"
    face.skin.freckles: "natural freckles"
    hair.signature_highlight.phrase: "lime-green face-framing highlights"
    hair.phrase: "long dark brunette hair"
    face.skin.texture: "real skin texture with visible pores"
    face.geometry.face_shape: "soft oval face"
    face.eyes.shape: "almond eyes"
    face.brows.phrase: "full dark eyebrows"
    face.skin.tone: "warm light-olive skin"

  # Emphasis weights, emitted as (phrase:w) when weighting is enabled.
  emphasis:
    face.eyes.colour: 1.15
    face.skin.freckles: 1.15
    hair.signature_highlight.phrase: 1.20

# ------------------------------------------------------------
# Physique identity anchors — see also config/physique.yaml
# ------------------------------------------------------------
physique_summary:
  build: "curvy hourglass, athletic through the waist, anatomically believable"
  height_impression: "average to slightly above average"
  notes: "Proportions are locked in config/physique.yaml and must not drift."

# ------------------------------------------------------------
# Signature props
# ------------------------------------------------------------
signature_props:
  purple_crystal_pendant:
    description: "small faceted purple crystal pendant on a fine gold chain"
    usage: contextual        # worn when the outfit has an open neckline
    frequency_target: 0.35   # appears in ~35% of accepted frames

# ------------------------------------------------------------
# Negative identity terms — always injected into the negative prompt
# ------------------------------------------------------------
identity_negatives:
  - "different woman"
  - "face morph"
  - "inconsistent facial structure"
  - "blue eyes"
  - "brown eyes"
  - "blonde hair"
  - "red hair"
  - "short hair"
  - "pink hair"
  - "blue hair"
  - "tattoo"
  - "tattoos"
  - "nose ring"
  - "septum piercing"
  - "heavy makeup"
  - "airbrushed plastic skin"
  - "doll face"
  - "uncanny valley"
  - "child"
  - "teenager"
  - "youthful minor features"
